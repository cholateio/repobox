<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>RepoBox</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e2f6b" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* One sheet per screen on desktop: title block on top, diagram left, a fixed reading column right. */
    * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.65 var(--sans); }
    a { color: var(--link); }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    [hidden] { display: none !important; }

    .view { min-height: 100%; display: flex; flex-direction: column; gap: 14px; max-width: 1440px; margin: 0 auto;
            padding: max(14px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
    .top { display: flex; align-items: center; gap: 14px; }
    .back { border: 1.5px solid var(--ink); border-radius: 999px; background: var(--sheet); padding: 2px 14px 2px 10px; font-size: 14px; font-weight: 600; color: var(--ink); text-decoration: none; }
    .mark { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; }
    .mark svg { width: 24px; height: 24px; }

    .msg { border: 2px solid var(--ink); background: var(--sheet); padding: 18px; display: grid; gap: 8px; max-width: 560px; }
    .msg p { margin: 0; }

    /* The back link sits outside the bar: beside it on desktop, above it on phones. */
    .barrow { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
    .barrow .tblock { align-self: stretch; }
    .back { white-space: nowrap; }
    @media (min-width: 1000px) { .barrow { flex-direction: row; align-items: center; gap: 14px; } .barrow .tblock { flex: 1; } }
    /* One bar: repo + tagline, the facts and the GitHub link. Stacks on phones. */
    .tblock { border: 2px solid var(--ink); background: var(--sheet); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .tblock > * { min-width: 0; }
    .tblock .head { grid-column: 1 / -1; padding: 6px 12px 8px; }
    .tblock h1 { margin: 0; font-size: 19px; line-height: 1.3; overflow-wrap: anywhere; }
    .tblock .sub { margin: 0; font-size: 13.5px; font-weight: 600; color: var(--mute); }
    .tblock .cell { padding: 6px 12px; border-top: 1.5px solid var(--ink); }
    .tblock .gh { grid-column: 1; padding: 6px 12px; border-top: 1.5px solid var(--ink); font-size: 13px; font-weight: 600; text-decoration: none; }
    .tblock .rm { grid-column: 3; padding: 6px 12px; border: 0; border-top: 1.5px solid var(--ink); background: none; font-size: 13px; font-weight: 600; color: var(--err); cursor: pointer; text-align: left; }
    .tblock .re { grid-column: 2; padding: 6px 12px; border: 0; border-top: 1.5px solid var(--ink); background: none; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; }
    .tblock .gh + .rm, .tblock .gh + .re, .tblock .re + .rm { border-left: 1.5px solid var(--ink); }
    .tblock .rm:disabled, .tblock .re:disabled { color: var(--mute); cursor: progress; }
    .lbl { display: block; font-size: 11.5px; color: var(--mute); }
    .val { display: block; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 999px) {
      .tblock .cell + .cell { border-left: 1.5px solid var(--ink); }
      .tblock { grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.8fr) minmax(0, 1.05fr); }
      .tblock .cell { padding: 6px 10px; }
      .tblock .cell .val { font-size: 14.5px; white-space: normal; overflow-wrap: anywhere; }
    }
    @media (min-width: 1000px) {
      .tblock { display: flex; align-items: stretch; }
      .tblock .head { flex: 1; display: flex; align-items: baseline; gap: 12px; padding: 8px 14px; white-space: nowrap; overflow: hidden; }
      .tblock h1 { font-size: 18px; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .tblock .sub { flex: 1 1 0; min-width: 4em; overflow: hidden; text-overflow: ellipsis; }
      .tblock .cell, .tblock .gh, .tblock .re, .tblock .rm { border-top: 0; border-left: 1.5px solid var(--ink); display: flex; align-items: baseline; gap: 8px; padding: 8px 14px; white-space: nowrap; flex: none; }
      .tblock .cell .lbl { display: inline; }
      .tblock .gh, .tblock .re, .tblock .rm { align-items: center; }
    }

    .read { display: grid; gap: 16px; grid-template-columns: 1fr; }
    .fig { margin: 0; border: 2px solid var(--ink); padding: 12px 8px; background-color: var(--sheet); display: grid; place-items: center; min-height: 0; position: relative;
           background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
    .fig.zoomable { cursor: zoom-in; }
    .fig .dia { display: block; width: 100%; height: auto; }
    .fig .hint { position: absolute; left: 10px; bottom: 6px; font-size: 12px; color: var(--mute); background: var(--sheet); padding: 0 6px; }
    .fig .rejected, .fig .nodia { margin: 24px; color: var(--mute); font-size: 14px; text-align: center; background: var(--sheet); padding: 8px 12px; }
    .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; }
    .sec h2 { margin: 0 0 6px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .sec h2::after { content: ""; flex: 1; border-top: 1.5px solid var(--rule); }
    .sec p { margin: 0; }
    .lead { font-size: 15.5px; line-height: 1.75; }
    .lead.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .linkish { justify-self: start; border: 0; background: none; padding: 0; margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--link); cursor: pointer; }
    .egs { display: grid; gap: 6px; margin-top: 8px; }
    .eg { display: grid; grid-template-columns: auto 1fr; gap: 10px; margin: 0; padding: 6px 10px; border: 1.5px solid var(--rule); background: var(--sheet); font-size: 13.5px; line-height: 1.6; }
    .eg b { font-size: 12px; color: var(--link); padding-top: 1px; white-space: nowrap; }
    .spec { width: 100%; border-collapse: collapse; border: 2px solid var(--ink); background: var(--sheet); font-size: 13.5px; line-height: 1.55; }
    .spec th { width: 6.5em; text-align: left; vertical-align: top; font-weight: 600; font-size: 12.5px; color: var(--mute); padding: 4px 10px; border-right: 1.5px solid var(--ink); }
    .spec td { padding: 4px 10px; }
    .spec tr + tr > * { border-top: 1.5px solid var(--rule); }
    .note { margin: 0; padding: 10px 12px; border: 1.5px dashed var(--rule); color: var(--mute); font-size: 14px; }
    .more { display: flex; flex-direction: column; min-height: 0; flex: 1; border: 2px solid var(--ink); background: var(--sheet); }
    .seg { display: flex; border-bottom: 1.5px solid var(--ink); }
    .seg button { flex: 1; border: 0; background: none; padding: 5px 8px; font-size: 13.5px; cursor: pointer; color: var(--mute); }
    .seg button + button { border-left: 1.5px solid var(--ink); }
    .seg button[aria-selected="true"] { background: var(--ink); color: var(--on-ink); font-weight: 600; }
    .panel { padding: 10px 14px; font-size: 14px; line-height: 1.7; overflow: auto; min-height: 0; flex: 1; }
    .panel.has-more { -webkit-mask-image: linear-gradient(#000 75%, transparent); mask-image: linear-gradient(#000 75%, transparent); }
    .panel ul { margin: 0; padding-left: 1.15em; display: grid; gap: 4px; }
    .stack { display: flex; flex-wrap: wrap; gap: 6px; }
    .stack span { font: 12.5px var(--mono); border: 1.5px solid var(--ink); padding: 1px 8px; }

    @media (min-width: 1000px) {
      /* Desktop: the page never scrolls; a short screen scrolls the reading column, a long tab its panel. */
      html:has(.read:not([hidden])), html:has(.read:not([hidden])) body { overflow: hidden; }
      .view:has(.read:not([hidden])) { height: 100%; padding-bottom: max(36px, env(safe-area-inset-bottom)); }
      .read { flex: 1; min-height: 0; grid-template-columns: minmax(0, 1fr) 480px; }
      .col { overflow-y: auto; }
      .more { min-height: 236px; }
      .fig { height: 100%; }
      .fig .dia { max-height: 100%; width: auto; max-width: 100%; }
    }

    /* Diagram recolor; coupled with the black-on-cream palette arch-blueprint draws in. */
    .dia { color: var(--ink); }
    .dia [stroke="#1a1a1a"] { stroke: var(--ink); }
    .dia [fill="#1a1a1a"] { fill: var(--ink); }
    .dia [fill="#faf8f4"] { fill: var(--sheet); }
    .dia .canvas { fill: transparent !important; }
    .dia .node, .dia .edge, .dia .label { transition: opacity .2s; }
    .dia.focus .node:not(.lit), .dia.focus .edge:not(.lit), .dia.focus .label:not(.lit) { opacity: .15; }
    .dia .edge.lit { stroke: var(--link); stroke-width: 2.6; }
    .dia .node.lit rect { stroke: var(--link); stroke-width: 2.6; }

    .lightbox { position: fixed; inset: 0; z-index: 20; background: var(--paper); display: flex; flex-direction: column;
                padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    .lb-bar { display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--ink);
              padding: 10px max(24px, env(safe-area-inset-right)) 10px max(24px, env(safe-area-inset-left)); }
    .lb-bar span { font-size: 13px; color: var(--mute); margin-right: auto; min-width: 0; }
    .tool { border: 1.5px solid var(--ink); background: var(--sheet); border-radius: 8px; padding: 2px 12px; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .stage { flex: 1; overflow: hidden; touch-action: none; cursor: grab; position: relative;
             background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
    .stage .dia { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; max-height: none; }
    .stage .node { cursor: pointer; }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="view">
    <div id="msg" class="msg" role="status" hidden></div>
    <div class="barrow">
      <a class="back" href="./">← 收藏</a>
      <div id="tblock" class="tblock" hidden></div>
    </div>
    <div id="read" class="read" hidden>
      <figure id="fig" class="fig" aria-label="架構圖"></figure>
      <div id="col" class="col"></div>
    </div>
  </main>

  <div id="lightbox" class="lightbox" role="dialog" aria-label="架構圖" hidden>
    <div class="lb-bar">
      <span>雙指或滾輪縮放、拖曳移動；點節點看它連到哪些元件</span>
      <button class="tool" type="button" data-reset>還原</button>
      <button class="tool" type="button" data-close>關閉</button>
    </div>
    <div class="stage" data-stage></div>
  </div>

  <script type="module" src="read.js"></script>
</body>
</html>
